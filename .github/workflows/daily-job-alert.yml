name: Daily Job Alert

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh jobs from cloud sources
        run: |
          python scripts/refresh_jobs.py

      - name: Build profile from resume
        run: |
          python scripts/job_alert.py build-profile --resume Chemuru_Leelamohan_Resume.pdf

      - name: Send daily alert
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python scripts/job_alert.py report --to "$TO_EMAIL"
